server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/users/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/auth/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/inventory/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/orders/**
        - id: store-service
          uri: ${STORE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/stores/**
        - id: shipping-service
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/shipping/**
        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/suppliers/**
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/billing/**
        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/reviews/**
        - id: coupon-service
          uri: ${COUPON_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/coupons/**

