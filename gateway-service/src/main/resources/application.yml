server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/auth/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
        - id: store-service
          uri: ${STORE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/stores/**
        - id: shipping-service
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/shipping/**
        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/suppliers/**
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/billing/**
        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/reviews/**
        - id: coupon-service
          uri: ${COUPON_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/coupons/**

